name: Frontend CI
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod
env:
  AWS_REGION: ap-south-1
  IMAGE_TAG: ${{ github.sha }}
jobs:
 frontend-build:
  name: Frontend Build Test Docker Push
  runs-on: ubuntu-latest
  permissions:
    id-token: write
    contents: read
  steps:
  - name: Checkout Code
    uses: actions/checkout@v4
  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 24
      cache: npm
      cache-dependency-path: frontend/frontend/package.json
  - name: Install Dependencies
    working-directory: frontend
    run:
      npm install
  - name: Lint Check
    working-directory: frontend
    run:
      npm run lint
  - name: Unit Test
    working-directory: frontend
    run:
      npm test -- --coverage
  - name: Build Application
    working-directory: frontend
    run:
      npm run build
  - name: Configure AWS
    uses: aws-actions/configure-aws-credentials@v4
    with:
      role-to-assume: ${{ secrets.AWS_ROLE }}
      aws-region: ${{ env.AWS_REGION }}
  - name: Login ECR
    uses: aws-actions/amazon-ecr-login@v2
  - name: Dockerfile Lint
    run:
      |
      docker run --rm \
      -i hadolint/hadolint \
      < frontend/Dockerfile
  - name: Build Docker Image
    run:
      docker build \
      -t ${{ secrets.FRONTEND_ECR }}:${IMAGE_TAG} \
      ./frontend
  - name: Trivy Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: ${{ secrets.FRONTEND_ECR }}:${{ github.sha }}
      severity: HIGH,CRITICAL
      exit-code: 1
  - name: Generate SBOM
    uses: anchore/sbom-action@v0
    with:
      image: ${{ secrets.FRONTEND_ECR }}:${{ github.sha }}
  - name: Push Image
    run:
      docker push \
      ${{ secrets.FRONTEND_ECR }}:${IMAGE_TAG}
  - name: Upload SBOM
    uses: actions/upload-artifact@v4
    with:
      name: frontend-sbom
      path: sbom*.spdx.json
