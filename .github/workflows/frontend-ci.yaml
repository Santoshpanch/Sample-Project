name: Frontend CI
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod
env:
  AWS_REGION: ap-south-1
  IMAGE_TAG: ${{ github.sha }}
jobs:
 frontend-build:
  name: Frontend Build Test Docker Push
  runs-on: ubuntu-latest
  permissions:
    id-token: write
    contents: read
  steps:
  - name: Checkout Code
    uses: actions/checkout@v4
  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 24
      cache: npm
      cache-dependency-path: frontend/package-lock.json
  - name: Install Dependencies
    working-directory: frontend
    continue-on-error: true
    run:
      npm install
  - name: Unit Test
    working-directory: frontend
    run:
      npm test -- --coverage --passWithNoTests
  - name: Build Application
    working-directory: frontend
    continue-on-error: true
    run:
      npm run build
  - name: Assume AWS Role using OIDC
    shell: bash
    env:
      ROLE_ARN: arn:aws:iam::519765643705:role/github-actions-ecr-role
      AWS_REGION: ap-south-1
    run: |
      set -euo pipefail
  
      echo "Requesting GitHub OIDC token..."
  
      TOKEN=$(curl -sSf \
        -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
        "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
        | jq -r '.value')
  
      if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
        echo "Failed to obtain OIDC token"
        exit 1
      fi
  
      echo "OIDC token acquired."
  
      CREDS=$(aws sts assume-role-with-web-identity \
        --role-arn "${ROLE_ARN}" \
        --role-session-name "github-actions-${GITHUB_RUN_ID}" \
        --web-identity-token "${TOKEN}" \
        --duration-seconds 3600 \
        --region "${AWS_REGION}")
  
      echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
      echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
      echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"
  
      echo "AWS credentials configured successfully."
  - name: Login ECR
    uses: aws-actions/amazon-ecr-login@v2
  - name: Dockerfile Lint
    run:
      |
      docker run --rm \
      -i hadolint/hadolint \
      < frontend/Dockerfile
  - name: Build Docker Image
    run:
      docker build \
      -t ${{ secrets.FRONTEND_ECR }}:${IMAGE_TAG} \
      ./frontend
  - name: Trivy Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: ${{ secrets.FRONTEND_ECR }}:${{ github.sha }}
      severity: HIGH,CRITICAL
      exit-code: 1
  - name: Generate SBOM
    uses: anchore/sbom-action@v0
    with:
      image: ${{ secrets.FRONTEND_ECR }}:${{ github.sha }}
  - name: Push Image
    run:
      docker push \
      ${{ secrets.FRONTEND_ECR }}:${IMAGE_TAG}
  - name: Upload SBOM
    uses: actions/upload-artifact@v4
    with:
      name: frontend-sbom
      path: sbom*.spdx.json
